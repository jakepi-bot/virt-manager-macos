name: verify-macos-arm64

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch: {}

env:
  # virt-manager master as inspected for this port (2026-09-04)
  UPSTREAM_SHA: bac5379d085219457a39c5e7c2a5855919d58ef8
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  packaged:
    name: packaged (Homebrew) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install virt-manager
        run: brew install virt-manager

      - name: Report installed versions
        run: |
          brew info virt-manager | sed -n '1,6p'
          brew list --versions virt-manager gtk+3 pygobject3 libvirt-python vte3 gtk-vnc spice-gtk libosinfo gtksourceview4 || true
          virt-manager --version
          virt-install --version

      - name: GI binding matrix (formula venv python)
        run: |
          VPY="$(brew --prefix)/opt/virt-manager/libexec/bin/python"
          [ -x "$VPY" ] || VPY="$(brew --prefix)/bin/python3"
          echo "using: $VPY"
          "$VPY" scripts/check-bindings.py | tee binding-matrix.txt

      - name: virtinst CLI smoke (test driver)
        run: |
          virt-install --connect test:///default --name ciguest --memory 64 \
            --disk none --import --osinfo detect=on,require=off --print-xml > guest.xml
          grep -q "<name>ciguest</name>" guest.xml && echo "virtinst smoke OK"

      - name: GUI launch smoke (manager window)
        run: |
          SMOKE_LOG="$PWD/smoke.log" bash scripts/smoke-test-macos.sh "virt-manager --no-fork --debug --connect test:///default"

      - name: GUI launch smoke (domain editor window)
        run: |
          SMOKE_LOG="$PWD/smoke-details.log" bash scripts/smoke-test-macos.sh "virt-manager --no-fork --debug --connect test:///default --show-domain-editor test" 15

      - name: Build .app bundle (thin, Homebrew launcher)
        run: |
          bash scripts/make-app-bundle.sh "$RUNNER_TEMP/apps"
          APP="$RUNNER_TEMP/apps/Virtual Machine Manager.app"
          test -x "$APP/Contents/MacOS/launcher"
          test -f "$APP/Contents/Info.plist"
          ls -la "$APP/Contents" "$APP/Contents/Resources" || true

      - name: REA CLI — inspect native arm64 Mach-O components
        if: always()
        run: |
          GTK_LIB="$(ls "$(brew --prefix)"/opt/gtk+3/lib/libgtk-3*.dylib 2>/dev/null | head -1)"
          VTE_LIB="$(ls "$(brew --prefix)"/opt/vte3/lib/libvte-2.91.0.dylib 2>/dev/null | head -1)"
          [ -n "$VTE_LIB" ] || VTE_LIB="$(ls "$(brew --prefix)"/opt/vte3/lib/libvte-2.91*.dylib 2>/dev/null | head -1)"
          LIBVIRT_SO="$(ls "$(brew --prefix)"/opt/libvirt-python/lib/python3.*/site-packages/libvirtmod*.so 2>/dev/null | head -1)"
          for f in "$GTK_LIB" "$VTE_LIB" "$LIBVIRT_SO"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then echo "missing: $f"; continue; fi
            out="rea-$(basename "$f").txt"
            { echo "== $f"; npx -y rea-agents@6.4.0 inspect-macho "$f" --format md --token-limit 2500 || echo "rea inspect-macho failed"; } > "$out" 2>&1
          done
          ls -la rea-* 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-packaged-${{ matrix.os }}
          path: |
            binding-matrix.txt
            guest.xml
            smoke.log
            smoke-details.log
            rea-*.txt
          if-no-files-found: warn

  from-source:
    name: from-source master · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install dependencies (component set of the Homebrew formula)
        run: bash scripts/install-deps-macos.sh

      - name: Fetch virt-manager master
        run: |
          SRC="$RUNNER_TEMP/virt-manager"
          git init --quiet "$SRC"
          git -C "$SRC" remote add origin https://github.com/virt-manager/virt-manager.git
          if ! git -C "$SRC" fetch --quiet --depth 1 origin "$UPSTREAM_SHA"; then
            echo "depth-1 fetch of $UPSTREAM_SHA failed; falling back to full fetch"
            git -C "$SRC" fetch --quiet origin
          fi
          git -C "$SRC" checkout --quiet "$UPSTREAM_SHA"
          git -C "$SRC" log -1 --format='checked out %H %ci %s'

      - name: Apply macOS port patches
        run: |
          cd "$RUNNER_TEMP/virt-manager"
          git apply --verbose "$GITHUB_WORKSPACE"/patches/*.patch

      - name: Version + binding matrix
        run: |
          PY="${VM_PYTHON:?install-deps-macos.sh did not find a usable python}"
          echo "python: $PY"
          "$PY" --version
          "$PY" "$RUNNER_TEMP/virt-manager/virt-manager" --version
          "$PY" scripts/check-bindings.py | tee binding-matrix.txt

      - name: GUI launch smoke (from source)
        run: |
          PY="${VM_PYTHON:?install-deps-macos.sh did not find a usable python}"
          SMOKE_LOG="$PWD/smoke.log" bash scripts/smoke-test-macos.sh "$PY $RUNNER_TEMP/virt-manager/virt-manager --no-fork --debug --connect test:///default"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-from-source-${{ matrix.os }}
          path: |
            binding-matrix.txt
            smoke.log
          if-no-files-found: warn

  bundle:
    name: self-contained .app (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install virt-manager
        run: brew install virt-manager

      - name: Build self-contained bundle
        env:
          BUNDLE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0-dev' }}
        run: /usr/bin/python3 scripts/macos-bundle.py dist

      - name: Assert app icon + Info.plist
        run: |
          APP="dist/Virtual Machine Manager.app"
          test -s "$APP/Contents/Resources/virt-manager.icns"
          ls -l "$APP/Contents/Resources/virt-manager.icns"
          file "$APP/Contents/Resources/virt-manager.icns"
          ICON=$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")
          test "$ICON" = "virt-manager"
          echo "OK: icns present and Info.plist references $ICON"
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"

      - name: Relocate app and run it with Homebrew hidden
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/relo"
          cp -R "dist/Virtual Machine Manager.app" "$RUNNER_TEMP/relo/"
          sudo mv /opt/homebrew /opt/.hb_hidden
          trap 'sudo mv /opt/.hb_hidden /opt/homebrew 2>/dev/null || true' EXIT
          env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            SMOKE_LOG="$GITHUB_WORKSPACE/bundle-smoke.log" \
            bash scripts/smoke-test-macos.sh "\"$RUNNER_TEMP/relo/Virtual Machine Manager.app/Contents/MacOS/launcher\" --no-fork --debug --connect test:///default" 25
          sudo mv /opt/.hb_hidden /opt/homebrew
          trap - EXIT

      - name: Assert zero Homebrew references at runtime
        if: always()
        run: |
          echo "--- sample of loaded libraries ---"
          grep -oE "/[^ ]+\.(dylib|so)" bundle-smoke.log 2>/dev/null | sort -u | head -30 || true
          if grep -q "/opt/homebrew" bundle-smoke.log; then
            echo "FAIL: /opt/homebrew referenced at runtime:"
            grep -m 10 "/opt/homebrew" bundle-smoke.log
            exit 1
          fi
          echo "OK: zero /opt/homebrew references in the runtime log"
          grep -E "SMOKE_RESULT|GTK version|Showing manager" bundle-smoke.log || true

      - name: Package zip + checksums
        run: |
          PKG="$RUNNER_TEMP/pkg/virt-manager-macos"
          mkdir -p "$PKG"
          ditto "$RUNNER_TEMP/relo/Virtual Machine Manager.app" "$PKG/Virtual Machine Manager.app"
          cp packaging/README-FIRST.txt packaging/NOTICE.txt "$PKG/"
          mkdir -p dist
          (cd "$RUNNER_TEMP/pkg" && ditto -c -k --keepParent virt-manager-macos "$GITHUB_WORKSPACE/dist/virt-manager-macos-arm64.zip")
          cd dist && shasum -a 256 virt-manager-macos-arm64.zip | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virt-manager-macos-app
          path: |
            dist/virt-manager-macos-arm64.zip
            SHA256SUMS.txt
            bundle-smoke.log
          if-no-files-found: warn

  release:
    name: publish GitHub release
    needs: [bundle]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: virt-manager-macos-app
          path: .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "virt-manager $GITHUB_REF_NAME — self-contained macOS arm64 app" \
            --notes-file packaging/RELEASE_NOTES.md \
            dist/virt-manager-macos-arm64.zip SHA256SUMS.txt \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            dist/virt-manager-macos-arm64.zip SHA256SUMS.txt
