name: verify-macos-arm64

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # virt-manager master as inspected for this port (2026-09-04)
  UPSTREAM_SHA: bac5379d085219457a39c5e7c2a5855919d58ef8
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  packaged:
    name: packaged (Homebrew) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15] # macos-26 (Tahoe) added once the first run is green
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install virt-manager
        run: brew install virt-manager

      - name: Report installed versions
        run: |
          brew list --versions virt-manager
          virt-manager --version
          virt-install --version

      - name: GI binding matrix
        run: |
          "$(brew --prefix)/bin/python3" scripts/check-bindings.py | tee binding-matrix.txt

      - name: virtinst CLI smoke (test driver)
        run: |
          virt-install --connect test:///default --name ciguest --memory 64 \
            --disk none --import --osinfo detect=on,require=off --print-xml > guest.xml
          grep -q "<name>ciguest</name>" guest.xml && echo "virtinst smoke OK"

      - name: GUI launch smoke
        run: SMOKE_LOG="$PWD/smoke.log" bash scripts/smoke-test-macos.sh "virt-manager --no-fork --debug --connect test:///default"

      - name: REA CLI — inspect native arm64 Mach-O components
        if: always()
        run: |
          GTK_LIB="$(ls "$(brew --prefix)"/opt/gtk+3/lib/libgtk-3*.dylib 2>/dev/null | head -1)"
          VTE_LIB="$(ls "$(brew --prefix)"/opt/vte3/lib/libvte-2.91*.dylib 2>/dev/null | head -1)"
          LIBVIRT_SO="$(ls "$(brew --prefix)"/opt/libvirt-python/lib/python3.15/site-packages/libvirtmod*.so 2>/dev/null | head -1)"
          for f in "$GTK_LIB" "$VTE_LIB" "$LIBVIRT_SO"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then echo "missing: $f"; continue; fi
            out="rea-$(basename "$f").txt"
            { echo "== $f"; npx -y rea-agents@6.4.0 inspect-macho "$f" --format md --token-limit 2500 || echo "rea inspect-macho failed"; } > "$out" 2>&1
          done
          ls -la rea-* 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-packaged-${{ matrix.os }}
          path: |
            binding-matrix.txt
            guest.xml
            smoke.log
            rea-*.txt
          if-no-files-found: warn

  from-source:
    name: from-source master · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15] # macos-26 (Tahoe) added once the first run is green
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install dependencies (same set as the Homebrew formula)
        run: bash scripts/install-deps-macos.sh

      - name: Fetch virt-manager master
        run: |
          git clone --quiet https://github.com/virt-manager/virt-manager.git "$RUNNER_TEMP/virt-manager"
          git -C "$RUNNER_TEMP/virt-manager" checkout --quiet "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/virt-manager" log -1 --format='checked out %H %ci %s'

      - name: Version + binding matrix
        run: |
          PY="$(brew --prefix)/bin/python3"
          "$PY" --version
          "$PY" "$RUNNER_TEMP/virt-manager/virt-manager" --version
          "$PY" scripts/check-bindings.py | tee binding-matrix.txt

      - name: GUI launch smoke
        run: |
          PY="$(brew --prefix)/bin/python3"
          SMOKE_LOG="$PWD/smoke.log" bash scripts/smoke-test-macos.sh "$PY $RUNNER_TEMP/virt-manager/virt-manager --no-fork --debug --connect test:///default"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-from-source-${{ matrix.os }}
          path: |
            binding-matrix.txt
            smoke.log
          if-no-files-found: warn
